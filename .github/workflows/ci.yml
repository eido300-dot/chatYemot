name: Tests

on: pull_request

permissions:
  contents: read

concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: local-ci-root
          MARIADB_DATABASE: chatyemot_ci_test
          MARIADB_USER: chatyemot
          MARIADB_PASSWORD: local-ci-test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Ensure FFmpeg is available
        shell: bash
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then
            . /etc/os-release
            sources="$RUNNER_TEMP/chatyemot-ubuntu.sources"
            printf '%s\n' \
              'Types: deb' \
              'URIs: https://archive.ubuntu.com/ubuntu/' \
              "Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-security" \
              'Components: main universe' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' > "$sources"
            apt_options=(
              -o "Dir::Etc::sourcelist=$sources"
              -o Dir::Etc::sourceparts=-
              -o Acquire::Retries=1
              -o Acquire::https::Timeout=15
              -o Acquire::Languages=none
            )
            sudo apt-get "${apt_options[@]}" update --error-on=any
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
      - name: Run Node tests
        env:
          TEST_DB_NAME: chatyemot_ci_test
          TEST_DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_USER: chatyemot
          DB_PASSWORD: local-ci-test
        run: node --test --test-concurrency=1 test/*.test.js
      - name: Run focused browser tests when present
        shell: bash
        run: |
          if compgen -G 'test/browser/*.test.js' >/dev/null; then
            CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
            export CHROMIUM_PATH
            node --test --test-concurrency=1 test/browser/*.test.js
          fi
