name: Android APK

# דחיפת תג v1.2.3 בונה APK חתום ומפרסם אותו ב-Releases; האפליקציה בודקת שם עדכונים.
on:
  push:
    tags: ["v*"]
    branches: ["android-build"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: building a TEST APK signed with a throwaway key (cannot be updated in place later)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias test -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass testpass -keypass testpass -dname "CN=chatyemot test"
            echo "KEYSTORE_PASSWORD=testpass" >> "$GITHUB_ENV"; echo "KEY_PASSWORD=testpass" >> "$GITHUB_ENV"; echo "KEY_ALIAS=test" >> "$GITHUB_ENV"
          fi

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else echo "::warning::No GOOGLE_SERVICES_JSON secret: building without push notifications (FCM)"; fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          gradle assembleRelease -PappVersion="$VERSION" \
            ${{ secrets.UPDATE_TOKEN != '' && format('-PgithubToken={0}', secrets.UPDATE_TOKEN) || '' }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/chatyemot-$VERSION.apk"
          echo "APK=$RUNNER_TEMP/chatyemot-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatyemot-apk
          path: ${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
